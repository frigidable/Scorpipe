name: LONG parity

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: long-parity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  long_parity:
    name: long_parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate LONG parity registry and harness
        run: pytest -q tests/test_p0_long_parity_harness.py tests/test_p0_failure_taxonomy.py

      - name: Run LONG parity fixture comparison
        run: |
          EXTRA="--fail-on-regression"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            EXTRA="--soft-fail"
          fi
          scorpio-pipe long-compare \
            --case benchmarks/long_parity/cases/mini_night_synthetic.case.json \
            --output long_parity_artifacts/mini_night \
            ${EXTRA}

      - name: Upload LONG parity artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: long-parity-artifacts
          path: long_parity_artifacts
          if-no-files-found: warn
          retention-days: 30
