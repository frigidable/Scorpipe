name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta_validate:
    name: meta_validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate .github/dependabot.yml parses as YAML and has 2 update blocks
        run: |
          python -m pip install --upgrade pip pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          p = Path(".github/dependabot.yml")
          data = yaml.safe_load(p.read_text(encoding="utf-8"))
          updates = data.get("updates")
          assert isinstance(updates, list), "dependabot.yml: 'updates' must be a list"
          assert len(updates) == 2, f"dependabot.yml: expected 2 update blocks, got {len(updates)}"
          ecos = [u.get("package-ecosystem") for u in updates]
          assert set(ecos) == {"github-actions", "pip"}, f"dependabot.yml: unexpected ecosystems {ecos}"
          print("OK: dependabot.yml parses and looks sane:", ecos)
          PY

      - name: Install actionlint
        run: |
          go version
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint (.github/workflows/*.yml)
        run: actionlint -color

  tests_fast:
    name: tests_fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests (fast)
        run: pytest -q -m "not smoke and not golden"

  tests_smoke:
    name: tests_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run smoke tests (synthetic end-to-end)
        env:
          SCORPIPE_CI_ARTIFACTS_DIR: ci_artifacts
        run: pytest -q -m smoke

      - name: Upload smoke artifacts (qc_report + navigator data.json)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-artifacts
          path: ci_artifacts
          if-no-files-found: warn
          retention-days: 7

  build_check:
    name: build_check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build (sdist/wheel)
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install from wheel + smoke test
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import scorpio_pipe; print('scorpio_pipe version:', getattr(scorpio_pipe, '__version__', 'unknown'))"
          scorpio-pipe --help

  dependency_review:
    name: dependency_review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check Dependency Review availability and changed definitions
        id: dependency_policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import fnmatch
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          from urllib.error import HTTPError
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr = event["pull_request"]
          repository = os.environ["GITHUB_REPOSITORY"]
          if pr["base"]["repo"]["full_name"] != repository:
              raise SystemExit("Unexpected base repository; cannot establish dependency scope")
          base, head = pr["base"]["sha"], pr["head"]["sha"]
          if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head)):
              raise SystemExit("Invalid base/head SHA; refusing an incomplete dependency review")

          # Use the immutable event SHAs and PR merge-base diff, not a moving
          # branch or paginated current-PR file list. Renames expose both paths.
          raw = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z", f"{base}...{head}", "--",
          ])
          paths = [os.fsdecode(p) for p in raw.split(b"\0") if p]

          def dependency_definition(path):
              p = PurePosixPath(path.lower())
              names = {
                  "pyproject.toml", "setup.py", "setup.cfg", "pipfile", "pipfile.lock",
                  "poetry.toml", "uv.toml", "pdm.toml", "tox.ini", ".python-version",
                  "pip.conf", "pip.ini", ".pypirc", ".condarc", ".gitmodules",
                  "package.json", "package-lock.json", "npm-shrinkwrap.json",
              }
              patterns = ("requirements*", "constraints*", "*.lock", "pylock*.toml",
                          "environment*.yml", "environment*.yaml", "conda*.yml",
                          "conda*.yaml", "dockerfile*")
              installer = p.suffix in {".bat", ".ps1", ".sh"} and any(
                  word in p.stem for word in ("setup", "install", "build")
              )
              return (p.name in names or installer
                      or any(fnmatch.fnmatchcase(p.name, pattern) for pattern in patterns)
                      or any(part in {"requirements", "constraints"} for part in p.parts)
                      or str(p).startswith((".github/workflows/", ".github/actions/"))
                      or str(p) in {".github/dependabot.yml", ".github/dependabot.yaml"})

          changed = sorted(p for p in paths if dependency_definition(p))
          print("Changed dependency/security definitions:", json.dumps(changed, ensure_ascii=True))
          url = (os.environ["GITHUB_API_URL"].rstrip("/") + "/repos/"
                 + quote(repository, safe="/") + f"/dependency-graph/compare/{base}...{head}")
          request = Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          available = True
          try:
              with urlopen(request, timeout=30) as response:
                  if not isinstance(json.load(response), list):
                      raise SystemExit("Unexpected dependency API response; refusing to bypass review")
          except HTTPError as exc:
              body = json.loads(exc.read())
              message = str(body.get("message", ""))
              docs = urlparse(str(body.get("documentation_url", "")))
              # A private-repo 403 Forbidden with this endpoint's documentation
              # is the known availability response. Auth, rate limits, 404/5xx,
              # malformed replies and network errors fail closed instead.
              unavailable = (
                  event["repository"].get("private") is True and exc.code == 403
                  and message == "Forbidden" and docs.scheme == "https"
                  and docs.netloc == "docs.github.com"
                  and docs.path.rstrip("/") == "/rest/dependency-graph/dependency-review"
              )
              if not unavailable:
                  raise SystemExit(f"Dependency API failed ({exc.code}): {message}")
              available = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"available={str(available).lower()}\n")
          if not available:
              notice = "Dependency Review is unavailable for this private repository."
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Dependency Review availability\n\n" + notice + "\n\n")
                  summary.write("Changed definitions: `" + json.dumps(changed, ensure_ascii=True) + "`\n")
              print("::warning::" + notice)
              if changed:
                  raise SystemExit("Dependency/security definitions changed: a supported dependency review "
                                   "or separately approved security gate is required. Blocking this PR.")
              print("No dependency definitions changed; availability exception only, not a vulnerability scan.")
          PY
      - name: Dependency Review
        if: steps.dependency_policy.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4.8.2 (tag v4)
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  pr_title:
    name: pr_title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - meta_validate
      - tests_fast
      - tests_smoke
      - build_check
      - pr_title
      - dependency_review
    steps:
      - name: Summarize required jobs
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          # PR checks may skip only on the events where their job-level `if`
          # deliberately excludes them. A skipped PR security check is a failure.
          allow_skipped = {"dependency_review", "pr_title"} if os.environ["EVENT_NAME"] in {"push", "workflow_dispatch"} else set()
          bad = []
          required = {"meta_validate", "tests_fast", "tests_smoke", "build_check", "pr_title", "dependency_review"}
          for job_id in sorted(required):
            res = needs.get(job_id, {}).get("result", "missing")
            if res == "success":
              continue
            if res == "skipped" and job_id in allow_skipped:
              continue
            bad.append(f"{job_id}={res}")
          if bad:
            print("Blocking merge: required CI jobs not successful:", ", ".join(bad))
            sys.exit(1)
          print("OK: all required CI jobs are green.")
          PY
